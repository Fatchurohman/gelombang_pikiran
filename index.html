<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualisasi Gelombang Otak (EEG)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 850px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .header p {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .mode-switch {
      display: flex;
      background-color: #0f172a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .btn-mode {
      padding: 8px 14px;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-mode.active {
      background-color: #38bdf8;
      color: #0f172a;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex: 1;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 100px;
      padding: 10px 12px;
      background-color: #334155;
      color: #f8fafc;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn:hover {
      background-color: #475569;
    }

    .btn.active {
      border-color: #38bdf8;
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background-color: #1e293b;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 380px;
      background-color: #020617;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .info-panel {
      margin-top: 20px;
      padding: 16px;
      background-color: #0f172a;
      border-radius: 8px;
      border-left: 4px solid #38bdf8;
    }

    .info-panel h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #f1f5f9;
    }

    .info-panel p {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>Visualisasi Karakteristik Gelombang Otak</h2>
      <p>Bandingkan frekuensi dan amplitudo secara individual atau bersamaan (Stack View)</p>
    </div>

    <div class="controls-bar">
      <div class="mode-switch" id="modeSelector">
        <button class="btn-mode active" data-mode="single">Single View</button>
        <button class="btn-mode" data-mode="stack">Stack View (Perbandingan)</button>
      </div>

      <div class="btn-group" id="waveSelector">
        <button class="btn active" data-type="DELTA">DELTA</button>
        <button class="btn" data-type="THETA">THETA</button>
        <button class="btn" data-type="ALPHA">ALPHA</button>
        <button class="btn" data-type="BETA">BETA</button>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="waveCanvas"></canvas>
    </div>

    <div class="info-panel" id="infoPanel">
      <h3 id="infoTitle">Gelombang Delta</h3>
      <p id="infoDesc">Loading...</p>
    </div>
  </div>

  <script>
    'use strict';

    // Konfigurasi Parameter Gelombang
    const WAVE_CONFIGS = Object.freeze({
      DELTA: {
        title: 'Gelombang Delta (0.5 - 4 Hz)',
        frequency: 0.008,
        amplitude: 65,
        speed: 0.02,
        color: '#ef4444',
        description: 'Amplitudo sangat tinggi dan frekuensi sangat lambat. Muncul saat tidur nyenyak tanpa mimpi (deep sleep) dan proses pemulihan fisik.'
      },
      THETA: {
        title: 'Gelombang Theta (4 - 8 Hz)',
        frequency: 0.02,
        amplitude: 45,
        speed: 0.04,
        color: '#f59e0b',
        description: 'Frekuensi lambat dengan amplitudo sedang-tinggi. Terjadi saat ngantuk berat, meditasi mendalam, atau intuisi kreatif.'
      },
      ALPHA: {
        title: 'Gelombang Alpha (8 - 12 Hz)',
        frequency: 0.045,
        amplitude: 30,
        speed: 0.06,
        color: '#10b981',
        description: 'Ritme teratur dan santai. Muncul saat pikiran rileks tapi tetap sadar, seperti setelah bermeditasi atau beristirahat sejenak.'
      },
      BETA: {
        title: 'Gelombang Beta (12 - 30 Hz)',
        frequency: 0.12,
        amplitude: 16,
        speed: 0.09,
        color: '#38bdf8',
        description: 'Frekuensi sangat rapat dan cepat dengan amplitudo rendah. Menandakan aktivitas mental aktif, fokus, logika, atau kondisi cemas.'
      }
    });

    class WaveVisualizer {
      constructor(canvasId, selectorId, modeId, infoTitleId, infoDescId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.selectorContainer = document.getElementById(selectorId);
        this.modeContainer = document.getElementById(modeId);
        this.infoTitle = document.getElementById(infoTitleId);
        this.infoDesc = document.getElementById(infoDescId);

        this.currentWaveKey = 'DELTA';
        this.viewMode = 'single'; // 'single' atau 'stack'
        this.step = 0;

        this.init();
      }

      init() {
        if (!this.canvas || !this.ctx) return;

        this.resizeCanvas();
        window.addEventListener('resize', () => this.resizeCanvas());

        this.bindEvents();
        this.updateUI();
        this.animate();
      }

      resizeCanvas() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.canvas.width = rect.width;
        this.canvas.height = rect.height;
      }

      bindEvents() {
        // Event Mode Switcher (Single / Stack)
        this.modeContainer.addEventListener('click', (event) => {
          const btn = event.target.closest('.btn-mode');
          if (!btn) return;

          const mode = btn.dataset.mode;
          if (mode && mode !== this.viewMode) {
            this.viewMode = mode;
            
            const modeBtns = this.modeContainer.querySelectorAll('.btn-mode');
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            this.updateUI();
          }
        });

        // Event Wave Selector
        this.selectorContainer.addEventListener('click', (event) => {
          if (this.viewMode === 'stack') return; // Nonaktif di mode stack

          const button = event.target.closest('.btn');
          if (!button) return;

          const type = button.dataset.type;
          if (type && WAVE_CONFIGS[type] && type !== this.currentWaveKey) {
            this.currentWaveKey = type;

            const buttons = this.selectorContainer.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            this.updateUI();
          }
        });
      }

      updateUI() {
        const waveBtns = this.selectorContainer.querySelectorAll('.btn');

        if (this.viewMode === 'stack') {
          waveBtns.forEach(btn => btn.setAttribute('disabled', 'true'));
          this.infoTitle.textContent = 'Mode Perbandingan Vertikal (Stack View)';
          this.infoTitle.style.color = '#38bdf8';
          this.infoDesc.textContent = 'Menampilkan ke-4 gelombang otak secara bersamaan. Perhatikan perbedaan nyata antara ritme lambat bergelombang tinggi (Delta) dibandingkan ritme cepat bergelombang pendek (Beta).';
        } else {
          waveBtns.forEach(btn => btn.removeAttribute('disabled'));
          const config = WAVE_CONFIGS[this.currentWaveKey];
          if (config) {
            this.infoTitle.textContent = config.title;
            this.infoTitle.style.color = config.color;
            this.infoDesc.textContent = config.description;
          }
        }
      }

      drawGrid() {
        const { width, height } = this.canvas;
        this.ctx.fillStyle = '#020617';
        this.ctx.fillRect(0, 0, width, height);

        this.ctx.strokeStyle = '#1e293b';
        this.ctx.lineWidth = 1;

        const gridSize = 40;
        for (let x = 0; x < width; x += gridSize) {
          this.ctx.beginPath();
          this.ctx.moveTo(x, 0);
          this.ctx.lineTo(x, height);
          this.ctx.stroke();
        }

        for (let y = 0; y < height; y += gridSize) {
          this.ctx.beginPath();
          this.ctx.moveTo(0, y);
          this.ctx.lineTo(width, y);
          this.ctx.stroke();
        }
      }

      drawSingleWave() {
        const config = WAVE_CONFIGS[this.currentWaveKey];
        if (!config) return;

        const { width, height } = this.canvas;
        const centerY = height / 2;

        // Garis Center
        this.ctx.strokeStyle = '#334155';
        this.ctx.beginPath();
        this.ctx.moveTo(0, centerY);
        this.ctx.lineTo(width, centerY);
        this.ctx.stroke();

        // Render Wave
        this.ctx.beginPath();
        this.ctx.lineWidth = 3;
        this.ctx.strokeStyle = config.color;

        for (let x = 0; x < width; x++) {
          const primaryWave = Math.sin((x * config.frequency) + this.step) * config.amplitude;
          const noiseWave = Math.sin((x * 0.2) + this.step * 2) * (config.amplitude * 0.08);
          const y = centerY + primaryWave + noiseWave;

          if (x === 0) this.ctx.moveTo(x, y);
          else this.ctx.lineTo(x, y);
        }
        this.ctx.stroke();
      }

      drawStackWaves() {
        const { width, height } = this.canvas;
        const keys = Object.keys(WAVE_CONFIGS);
        const sectionHeight = height / keys.length;

        keys.forEach((key, index) => {
          const config = WAVE_CONFIGS[key];
          const centerY = (sectionHeight * index) + (sectionHeight / 2);

          // Garis pembatas antar track
          if (index > 0) {
            this.ctx.strokeStyle = '#334155';
            this.ctx.lineWidth = 1;
            this.ctx.beginPath();
            this.ctx.moveTo(0, sectionHeight * index);
            this.ctx.lineTo(width, sectionHeight * index);
            this.ctx.stroke();
          }

          // Label Gelombang
          this.ctx.fillStyle = config.color;
          this.ctx.font = 'bold 12px "Segoe UI", sans-serif';
          this.ctx.fillText(key, 12, centerY - 15);

          // Render Wave (Skala amplitudo disesuaikan untuk mode stack)
          const scaledAmplitude = config.amplitude * 0.35;

          this.ctx.beginPath();
          this.ctx.lineWidth = 2;
          this.ctx.strokeStyle = config.color;

          for (let x = 0; x < width; x++) {
            const primaryWave = Math.sin((x * config.frequency) + this.step) * scaledAmplitude;
            const noiseWave = Math.sin((x * 0.2) + this.step * 2) * (scaledAmplitude * 0.08);
            const y = centerY + primaryWave + noiseWave;

            if (x === 0) this.ctx.moveTo(x, y);
            else this.ctx.lineTo(x, y);
          }
          this.ctx.stroke();
        });
      }

      animate() {
        this.drawGrid();

        if (this.viewMode === 'stack') {
          this.drawStackWaves();
        } else {
          this.drawSingleWave();
        }

        this.step += 0.04;
        requestAnimationFrame(() => this.animate());
      }
    }

    // Inisialisasi Aplikasi
    document.addEventListener('DOMContentLoaded', () => {
      new WaveVisualizer('waveCanvas', 'waveSelector', 'modeSelector', 'infoTitle', 'infoDesc');
    });
  </script>
</body>
</html>
