<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GelombangPikiran - Audio Generator & Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: rgba(30, 27, 75, 0.65);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    h1 {
      font-size: 1.75rem;
      text-align: center;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      margin-bottom: 6px;
    }

    /* Identitas Developer + Lampu Kelap-Kelip */
    .developer-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #a5b4fc;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse-glow 1.5s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0% {
        transform: scale(0.9);
        opacity: 0.4;
        box-shadow: 0 0 2px #22c55e;
      }
      50% {
        transform: scale(1.3);
        opacity: 1;
        box-shadow: 0 0 10px #22c55e;
      }
      100% {
        transform: scale(0.9);
        opacity: 0.4;
        box-shadow: 0 0 2px #22c55e;
      }
    }

    p.subtitle {
      font-size: 0.85rem;
      text-align: center;
      color: #94a3b8;
      margin-bottom: 22px;
    }

    .canvas-container {
      width: 100%;
      height: 140px;
      background-color: #030712;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid rgba(129, 140, 248, 0.2);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-wave {
      background-color: rgba(30, 41, 59, 0.7);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
    }

    .btn-wave:hover {
      background-color: rgba(51, 65, 85, 0.9);
      border-color: rgba(129, 140, 248, 0.4);
    }

    .btn-wave.active {
      border-color: #38bdf8;
      background-color: rgba(15, 23, 42, 0.9);
      color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .btn-wave span.freq {
      font-size: 0.8rem;
      opacity: 0.8;
      font-weight: 400;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .volume-container label {
      font-size: 0.875rem;
      color: #cbd5e1;
    }

    .volume-container input {
      flex: 1;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: all 0.25s ease;
    }

    .btn-action:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.6);
    }

    .btn-action.stop {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.4);
    }

    .btn-action.stop:hover {
      background: linear-gradient(135deg, #be123c 0%, #9f1239 100%);
      box-shadow: 0 6px 18px rgba(225, 29, 72, 0.6);
    }

    .note {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>GelombangPikiran</h1>
    
    <div class="developer-badge">
      <span class="pulse-dot"></span>
      <span>Developer : fatur62</span>
    </div>

    <p class="subtitle">Pemicu Frekuensi Otak & Binaural Beats</p>

    <div class="canvas-container">
      <canvas id="waveCanvas"></canvas>
    </div>

    <div class="controls">
      <button class="btn-wave active" data-type="alpha" data-base="200" data-diff="10">
        <span>Gelombang Alfa (Rileks & Fokus)</span>
        <span class="freq">10 Hz</span>
      </button>
      <button class="btn-wave" data-type="theta" data-base="150" data-diff="6">
        <span>Gelombang Theta (Imajinasi & Meditasi)</span>
        <span class="freq">6 Hz</span>
      </button>
      <button class="btn-wave" data-type="delta" data-base="100" data-diff="2">
        <span>Gelombang Delta (Tidur Lelap & Pulih)</span>
        <span class="freq">2 Hz</span>
      </button>
    </div>

    <div class="volume-container">
      <label for="volume">Volume:</label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.3">
    </div>

    <button id="toggleBtn" class="btn-action">Mulai Audio</button>
    
    <p class="note">*Gunakan earphone/headphone agar efek binaural beats bekerja optimal.</p>
  </div>

  <script>
    // State Aplikasi
    let audioCtx = null;
    let oscLeft = null;
    let oscRight = null;
    let gainNode = null;
    let mergerNode = null;
    let isPlaying = false;

    // Config Gelombang Aktif
    let currentConfig = {
      baseFreq: 200,
      diffFreq: 10,
      color: '#38bdf8'
    };

    // Elemen DOM
    const toggleBtn = document.getElementById('toggleBtn');
    const volumeInput = document.getElementById('volume');
    const waveButtons = document.querySelectorAll('.btn-wave');
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');

    // Penanganan Ukuran Canvas
    function resizeCanvas() {
      if (canvas) {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Inisialisasi Audio Context secara Aman
    function initAudio() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          alert('Web Audio API tidak didukung di browser ini.');
          return false;
        }
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return true;
      } catch (error) {
        console.error('Gagal menginisialisasi AudioContext:', error);
        return false;
      }
    }

    // Memulai Audio Binaural Beats
    function startAudio() {
      if (!initAudio()) return;

      try {
        stopAudio();

        const base = parseFloat(currentConfig.baseFreq) || 200;
        const diff = parseFloat(currentConfig.diffFreq) || 10;
        const vol = parseFloat(volumeInput.value) || 0.3;

        mergerNode = audioCtx.createChannelMerger(2);
        gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);

        oscLeft = audioCtx.createOscillator();
        oscLeft.type = 'sine';
        oscLeft.frequency.setValueAtTime(base, audioCtx.currentTime);

        oscRight = audioCtx.createOscillator();
        oscRight.type = 'sine';
        oscRight.frequency.setValueAtTime(base + diff, audioCtx.currentTime);

        oscLeft.connect(mergerNode, 0, 0);
        oscRight.connect(mergerNode, 0, 1);

        mergerNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscLeft.start();
        oscRight.start();

        isPlaying = true;
        toggleBtn.textContent = 'Hentikan Audio';
        toggleBtn.classList.add('stop');
      } catch (error) {
        console.error('Gagal menjalankan audio:', error);
        stopAudio();
      }
    }

    // Menghentikan Audio secara Aman
    function stopAudio() {
      try {
        if (oscLeft) {
          oscLeft.stop();
          oscLeft.disconnect();
          oscLeft = null;
        }
        if (oscRight) {
          oscRight.stop();
          oscRight.disconnect();
          oscRight = null;
        }
        if (mergerNode) {
          mergerNode.disconnect();
          mergerNode = null;
        }
        if (gainNode) {
          gainNode.disconnect();
          gainNode = null;
        }
      } catch (error) {
        console.error('Kesalahan saat menghentikan audio:', error);
      } finally {
        isPlaying = false;
        toggleBtn.textContent = 'Mulai Audio';
        toggleBtn.classList.remove('stop');
      }
    }

    // Event Listener Toggle Play/Stop
    toggleBtn.addEventListener('click', () => {
      if (isPlaying) {
        stopAudio();
      } else {
        startAudio();
      }
    });

    // Event Listener Pengaturan Volume
    volumeInput.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (gainNode && audioCtx && typeof val === 'number') {
        gainNode.gain.setValueAtTime(val, audioCtx.currentTime);
      }
    });

    // Event Listener Pilihan Jenis Gelombang
    waveButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        waveButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');

        const type = btn.getAttribute('data-type');
        currentConfig.baseFreq = parseFloat(btn.getAttribute('data-base')) || 200;
        currentConfig.diffFreq = parseFloat(btn.getAttribute('data-diff')) || 10;

        if (type === 'alpha') currentConfig.color = '#38bdf8';
        if (type === 'theta') currentConfig.color = '#c084fc';
        if (type === 'delta') currentConfig.color = '#818cf8';

        if (isPlaying) {
          startAudio();
        }
      });
    });

    // Animasi Visualizer Canvas
    let step = 0;
    function drawWave() {
      requestAnimationFrame(drawWave);

      if (!ctx || !canvas) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = currentConfig.color;
      ctx.shadowBlur = isPlaying ? 10 : 2;
      ctx.shadowColor = currentConfig.color;

      const height = canvas.height;
      const width = canvas.width;
      const freqMultiplier = isPlaying ? (currentConfig.diffFreq * 0.02) : 0.01;
      const amplitude = isPlaying ? 25 : 8;

      step += isPlaying ? 0.05 : 0.02;

      for (let x = 0; x < width; x++) {
        const y = Math.sin(x * freqMultiplier + step) * amplitude + (height / 2);
        if (x === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();
    }

    // Mulai Render Animasi
    drawWave();
  </script>
</body>
</html>
