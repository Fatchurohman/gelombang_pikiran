<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GelombangPikiran - Audio Wave Generator & Mind Tools</title>
  
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: rgba(22, 28, 45, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #00d2ff;
      --accent-purple: #925fff;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(146, 95, 255, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 10px;
    }

    /* Header & Badge Developer */
    header {
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    /* Badge Developer & Live Visit Counter */
    .developer-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* Card Component */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    /* Visualizer Canvas */
    #visualizer {
      width: 100%;
      height: 100px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      display: block;
    }

    /* Controls Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-blue);
    }

    button.active {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(146, 95, 255, 0.2));
      border-color: var(--accent-blue);
      color: #fff;
    }

    /* Latihan Napas */
    .breath-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    .breath-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-blue), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
      transition: transform 4s ease-in-out;
    }

    .breath-circle.expand {
      transform: scale(1.6);
    }

    .breath-circle.contract {
      transform: scale(1);
    }

    .breath-text {
      margin-top: 15px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    /* Quick Notes */
    textarea {
      width: 100%;
      height: 90px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px;
      color: var(--text-main);
      resize: none;
      font-size: 0.85rem;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent-purple);
    }

    /* Main Toggle Play */
    .play-btn {
      grid-column: span 2;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #fff;
      font-size: 1rem;
      border: none;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header -->
    <header>
      <h1>🧠 GelombangPikiran</h1>
      <p class="subtitle">Binaural Beats & Audio Mind Tools</p>
      
      <!-- Developer Badge & Real-Time Kunjungan -->
      <div class="developer-badge">
        <span class="pulse-dot"></span>
        <span>Developer : fatur62</span>
        <span style="opacity: 0.3;">|</span>
        <span>👁️ <span id="visit-counter">...</span> Kunjungan</span>
      </div>
    </header>

    <!-- Visualizer & Sound Generator -->
    <div class="card">
      <div class="card-title">🎧 Frequency Generator</div>
      <canvas id="visualizer"></canvas>
      
      <div class="controls-grid">
        <button onclick="setFrequency(14, 'Beta - Fokus High')" class="active">Beta (14Hz) - Fokus</button>
        <button onclick="setFrequency(10, 'Alpha - Relaksasi Santai')">Alpha (10Hz) - Santai</button>
        <button onclick="setFrequency(6, 'Theta - Meditasi & Kreatif')">Theta (6Hz) - Meditasi</button>
        <button onclick="setFrequency(2, 'Delta - Tidur Nyenyak')">Delta (2Hz) - Tidur</button>
        
        <button id="mainPlayBtn" class="play-btn" onclick="toggleAudio()">Mulai Putar Audio</button>
      </div>
    </div>

    <!-- Interactive Breathing Guide -->
    <div class="card">
      <div class="card-title">🫁 Panduan Latihan Napas (4-7-8)</div>
      <div class="breath-container">
        <div id="breathCircle" class="breath-circle"></div>
        <div id="breathText" class="breath-text">Tekan mulai untuk rileks</div>
        <button style="margin-top: 15px; width: 100%;" onclick="toggleBreathing()">Mulai Latihan Napas</button>
      </div>
    </div>

    <!-- Quick Eureka Notes -->
    <div class="card">
      <div class="card-title">📝 Catatan Eureka (Auto-Save)</div>
      <textarea id="eurekaNotes" placeholder="Tuliskan ide mendadak kamu di sini..." oninput="saveNotes()"></textarea>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. FITUR VISIT COUNTER REAL-TIME (NO SUPABASE)
    // ==========================================
    async function initVisitCounter() {
      const counterElement = document.getElementById('visit-counter');
      const apiKey = 'gelombangpikiran-fatur62-app'; // Unique ID untuk aplikasi ini
      
      try {
        // Memanggil Counter API gratis untuk increment (+1)
        const response = await fetch(`https://api.counterapi.dev/v1/${apiKey}/visits/up`);
        const data = await response.json();
        
        if (data && data.count !== undefined) {
          counterElement.textContent = data.count.toLocaleString('id-ID');
        } else {
          // Fallback jika API sedang gangguan
          fetchGetCounter();
        }
      } catch (err) {
        console.warn("Gagal memuat penghitung kunjungan:", err);
        counterElement.textContent = "1";
      }
    }

    async function fetchGetCounter() {
      const counterElement = document.getElementById('visit-counter');
      const apiKey = 'gelombangpikiran-fatur62-app';
      try {
        const response = await fetch(`https://api.counterapi.dev/v1/${apiKey}/visits`);
        const data = await response.json();
        if (data && data.count !== undefined) {
          counterElement.textContent = data.count.toLocaleString('id-ID');
        }
      } catch (e) {
        counterElement.textContent = "1";
      }
    }

    // Jalankan penghitung kunjungan saat halaman dibuka
    document.addEventListener('DOMContentLoaded', initVisitCounter);

    // ==========================================
    // 2. AUDIO WEB API (BINAURAL BEATS GENERATOR)
    // ==========================================
    let audioCtx;
    let oscLeft, oscRight;
    let isPlaying = false;
    let currentBeatFreq = 14; 
    const baseFreq = 200; 

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function toggleAudio() {
      initAudio();
      const btn = document.getElementById('mainPlayBtn');
      
      if (!isPlaying) {
        audioCtx.resume();
        
        // Merging 2 Binaural Channels
        const merger = audioCtx.createChannelMerger(2);
        
        oscLeft = audioCtx.createOscillator();
        oscRight = audioCtx.createOscillator();

        oscLeft.frequency.value = baseFreq;
        oscRight.frequency.value = baseFreq + currentBeatFreq;

        oscLeft.connect(merger, 0, 0); 
        oscRight.connect(merger, 0, 1); 

        merger.connect(audioCtx.destination);

        oscLeft.start();
        oscRight.start();

        isPlaying = true;
        btn.textContent = "Hentikan Audio";
        btn.style.background = "#ef4444";
        drawCanvas();
      } else {
        stopAudio();
      }
    }

    function stopAudio() {
      if (oscLeft) oscLeft.stop();
      if (oscRight) oscRight.stop();
      isPlaying = false;
      const btn = document.getElementById('mainPlayBtn');
      btn.textContent = "Mulai Putar Audio";
      btn.style.background = "linear-gradient(135deg, var(--accent-blue), var(--accent-purple))";
    }

    function setFrequency(freq, label) {
      currentBeatFreq = freq;
      
      // Update UI Buttons
      const buttons = document.querySelectorAll('.controls-grid button:not(.play-btn)');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (isPlaying) {
        oscRight.frequency.setValueAtTime(baseFreq + currentBeatFreq, audioCtx.currentTime);
      }
    }

    // ==========================================
    // 3. CANVAS WAVE VISUALIZER
    // ==========================================
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    let waveStep = 0;

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.beginPath();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#00d2ff';

      const width = canvas.width;
      const height = canvas.height;
      const amplitude = isPlaying ? 20 : 2;
      const frequency = 0.02;

      for (let x = 0; x < width; x++) {
        const y = height / 2 + Math.sin(x * frequency + waveStep) * amplitude;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      waveStep += isPlaying ? 0.08 : 0.02;
      requestAnimationFrame(drawCanvas);
    }
    drawCanvas();

    // ==========================================
    // 4. BREATHING GUIDE (4-7-8)
    // ==========================================
    let isBreathing = false;
    let breathInterval;

    function toggleBreathing() {
      const circle = document.getElementById('breathCircle');
      const text = document.getElementById('breathText');
      
      if (!isBreathing) {
        isBreathing = true;
        text.textContent = "Tarik napas perlahan... (4 detik)";
        circle.classList.add('expand');

        breathInterval = setInterval(() => {
          text.textContent = "Tahan napas... (7 detik)";
          
          setTimeout(() => {
            text.textContent = "Hembuskan perlahan... (8 detik)";
            circle.classList.remove('expand');
          }, 3000);

          setTimeout(() => {
            text.textContent = "Tarik napas perlahan...";
            circle.classList.add('expand');
          }, 7000);

        }, 11000);
      } else {
        clearInterval(breathInterval);
        circle.classList.remove('expand');
        text.textContent = "Latihan selesai / dihentikan";
        isBreathing = false;
      }
    }

    // ==========================================
    // 5. LOCALSTORAGE EUREKA NOTES
    // ==========================================
    const notesBox = document.getElementById('eurekaNotes');
    
    // Load catatan sebelumnya jika ada
    notesBox.value = localStorage.getItem('gelombang_eureka_notes') || '';

    function saveNotes() {
      localStorage.setItem('gelombang_eureka_notes', notesBox.value);
    }
  </script>

</body>
</html>
