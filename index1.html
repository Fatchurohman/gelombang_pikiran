<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GelombangPikiran - Audio Generator & Wellness Suite</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: rgba(30, 27, 75, 0.65);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 28px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    h1 {
      font-size: 1.75rem;
      text-align: center;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      margin-bottom: 4px;
    }

    .developer-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #a5b4fc;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse-glow 1.5s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0% { transform: scale(0.9); opacity: 0.4; box-shadow: 0 0 2px #22c55e; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 10px #22c55e; }
      100% { transform: scale(0.9); opacity: 0.4; box-shadow: 0 0 2px #22c55e; }
    }

    p.subtitle {
      font-size: 0.85rem;
      text-align: center;
      color: #94a3b8;
      margin-bottom: 18px;
    }

    /* Navigasi Tab Menu */
    .tab-nav {
      display: flex;
      gap: 6px;
      background-color: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .tab-btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .canvas-container {
      width: 100%;
      height: 130px;
      background-color: #030712;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid rgba(129, 140, 248, 0.2);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .btn-wave {
      background-color: rgba(30, 41, 59, 0.7);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .btn-wave:hover {
      background-color: rgba(51, 65, 85, 0.9);
      border-color: rgba(129, 140, 248, 0.4);
    }

    .btn-wave.active {
      border-color: #38bdf8;
      background-color: rgba(15, 23, 42, 0.9);
      color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    .btn-wave span.freq {
      font-size: 0.75rem;
      opacity: 0.8;
      font-weight: 400;
    }

    .setting-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .setting-group input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .setting-group select {
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 8px;
      outline: none;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
    }

    .btn-action.stop {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.4);
    }

    /* Modul Pernapasan */
    .breath-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    .breath-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56,189,248,0.4) 0%, rgba(15,23,42,0.8) 70%);
      border: 2px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      transition: transform 4s ease-in-out;
      margin-bottom: 16px;
    }

    /* Modul Catatan Eureka */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    textarea.note-input {
      width: 100%;
      height: 100px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      color: #f8fafc;
      font-size: 0.85rem;
      resize: none;
      outline: none;
    }

    textarea.note-input:focus {
      border-color: #38bdf8;
    }

    .note-list {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note-item {
      background-color: rgba(15, 23, 42, 0.8);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      border-left: 3px solid #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .note-item button {
      background: none;
      border: none;
      color: #f43f5e;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .note-footer {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>GelombangPikiran</h1>
    
    <div class="developer-badge">
      <span class="pulse-dot"></span>
      <span>Developer : fatur62</span>
    </div>

    <p class="subtitle">Audio Generator & Mental Wellness Suite</p>

    <!-- Navigasi Tab -->
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('audioTab')">Audio Waves</button>
      <button class="tab-btn" onclick="switchTab('breathTab')">Napas 4-7-8</button>
      <button class="tab-btn" onclick="switchTab('notesTab')">Catatan Eureka</button>
    </div>

    <!-- TAB 1: AUDIO GENERATOR -->
    <div id="audioTab" class="tab-content active">
      <div class="canvas-container">
        <canvas id="waveCanvas"></canvas>
      </div>

      <div class="controls">
        <button class="btn-wave" data-type="gamma" data-base="250" data-diff="40">
          <span>Gelombang Gamma (Super Fokus & Aha!)</span>
          <span class="freq">40 Hz</span>
        </button>
        <button class="btn-wave" data-type="beta" data-base="220" data-diff="15">
          <span>Gelombang Beta (Kerja & Analitis)</span>
          <span class="freq">15 Hz</span>
        </button>
        <button class="btn-wave active" data-type="alpha" data-base="200" data-diff="10">
          <span>Gelombang Alfa (Rileks & Tenang)</span>
          <span class="freq">10 Hz</span>
        </button>
        <button class="btn-wave" data-type="theta" data-base="150" data-diff="6">
          <span>Gelombang Theta (Imajinasi & Meditasi)</span>
          <span class="freq">6 Hz</span>
        </button>
        <button class="btn-wave" data-type="delta" data-base="100" data-diff="2">
          <span>Gelombang Delta (Tidur Lelap & Pulih)</span>
          <span class="freq">2 Hz</span>
        </button>
      </div>

      <div class="setting-group">
        <label for="volume">Volume:</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.3">
      </div>

      <div class="setting-group">
        <label for="timerSelect">Timer Otomatis:</label>
        <select id="timerSelect">
          <option value="0">Matikan (Manual)</option>
          <option value="15">15 Menit</option>
          <option value="30">30 Menit</option>
          <option value="60">60 Menit</option>
        </select>
      </div>

      <button id="toggleBtn" class="btn-action">Mulai Audio</button>
    </div>

    <!-- TAB 2: PANDUAN NAPAS -->
    <div id="breathTab" class="tab-content">
      <div class="breath-box">
        <div id="breathCircle" class="breath-circle">Tarik Napas</div>
        <p id="breathInstruction" style="font-size: 0.85rem; color: #cbd5e1; text-align: center;">
          Ikuti ritme lingkaran untuk menurunkan frekuensi otak.
        </p>
      </div>
      <button id="breathBtn" class="btn-action">Mulai Latihan Napas</button>
    </div>

    <!-- TAB 3: CATATAN EUREKA -->
    <div id="notesTab" class="tab-content">
      <div class="notes-container">
        <textarea id="noteInput" class="note-input" placeholder="Tuliskan ide mendadak atau ide Eureka kamu di sini..."></textarea>
        <button id="saveNoteBtn" class="btn-action">Simpan Catatan</button>
        <div id="noteList" class="note-list"></div>
      </div>
    </div>

    <p class="note-footer">*Gunakan earphone/headphone agar efek binaural beats bekerja optimal.</p>
  </div>

  <script>
    // System State
    let audioCtx = null;
    let oscLeft = null;
    let oscRight = null;
    let gainNode = null;
    let mergerNode = null;
    let isPlaying = false;
    let timerId = null;

    let currentConfig = {
      baseFreq: 200,
      diffFreq: 10,
      color: '#38bdf8'
    };

    // DOM Elements
    const toggleBtn = document.getElementById('toggleBtn');
    const volumeInput = document.getElementById('volume');
    const timerSelect = document.getElementById('timerSelect');
    const waveButtons = document.querySelectorAll('.btn-wave');
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');

    // Navigation Tab
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');

      if (tabId === 'audioTab') resizeCanvas();
    }

    // Canvas Resize
    function resizeCanvas() {
      if (canvas && canvas.parentElement) {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Audio Engine
    function initAudio() {
      try {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioClass) return false;
        if (!audioCtx) audioCtx = new AudioClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return true;
      } catch (e) {
        console.error('Audio Init Error:', e);
        return false;
      }
    }

    function startAudio() {
      if (!initAudio()) return;

      try {
        stopAudio();

        const base = parseFloat(currentConfig.baseFreq) || 200;
        const diff = parseFloat(currentConfig.diffFreq) || 10;
        const vol = parseFloat(volumeInput.value) || 0.3;

        mergerNode = audioCtx.createChannelMerger(2);
        gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);

        oscLeft = audioCtx.createOscillator();
        oscLeft.type = 'sine';
        oscLeft.frequency.setValueAtTime(base, audioCtx.currentTime);

        oscRight = audioCtx.createOscillator();
        oscRight.type = 'sine';
        oscRight.frequency.setValueAtTime(base + diff, audioCtx.currentTime);

        oscLeft.connect(mergerNode, 0, 0);
        oscRight.connect(mergerNode, 0, 1);

        mergerNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscLeft.start();
        oscRight.start();

        isPlaying = true;
        toggleBtn.textContent = 'Hentikan Audio';
        toggleBtn.classList.add('stop');

        // Handling Auto Timer
        const minutes = parseInt(timerSelect.value);
        if (minutes > 0) {
          timerId = setTimeout(() => {
            stopAudio();
            alert(`Timer ${minutes} menit selesai. Audio dihentikan.`);
          }, minutes * 60 * 1000);
        }
      } catch (e) {
        console.error('Start Audio Error:', e);
        stopAudio();
      }
    }

    function stopAudio() {
      try {
        if (timerId) clearTimeout(timerId);
        if (oscLeft) { oscLeft.stop(); oscLeft.disconnect(); oscLeft = null; }
        if (oscRight) { oscRight.stop(); oscRight.disconnect(); oscRight = null; }
        if (mergerNode) { mergerNode.disconnect(); mergerNode = null; }
        if (gainNode) { gainNode.disconnect(); gainNode = null; }
      } catch (e) {
        console.error('Stop Audio Error:', e);
      } finally {
        isPlaying = false;
        toggleBtn.textContent = 'Mulai Audio';
        toggleBtn.classList.remove('stop');
      }
    }

    toggleBtn.addEventListener('click', () => isPlaying ? stopAudio() : startAudio());

    volumeInput.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (gainNode && audioCtx && typeof val === 'number') {
        gainNode.gain.setValueAtTime(val, audioCtx.currentTime);
      }
    });

    waveButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        waveButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');

        const type = btn.getAttribute('data-type');
        currentConfig.baseFreq = parseFloat(btn.getAttribute('data-base')) || 200;
        currentConfig.diffFreq = parseFloat(btn.getAttribute('data-diff')) || 10;

        if (type === 'gamma') currentConfig.color = '#f43f5e';
        if (type === 'beta') currentConfig.color = '#f59e0b';
        if (type === 'alpha') currentConfig.color = '#38bdf8';
        if (type === 'theta') currentConfig.color = '#c084fc';
        if (type === 'delta') currentConfig.color = '#818cf8';

        if (isPlaying) startAudio();
      });
    });

    // Wave Visualizer
    let step = 0;
    function drawWave() {
      requestAnimationFrame(drawWave);
      if (!ctx || !canvas) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = currentConfig.color;
      ctx.shadowBlur = isPlaying ? 10 : 2;
      ctx.shadowColor = currentConfig.color;

      const height = canvas.height;
      const width = canvas.width;
      const freqMultiplier = isPlaying ? (currentConfig.diffFreq * 0.015) : 0.01;
      const amplitude = isPlaying ? 22 : 6;

      step += isPlaying ? 0.05 : 0.02;

      for (let x = 0; x < width; x++) {
        const y = Math.sin(x * freqMultiplier + step) * amplitude + (height / 2);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    drawWave();

    // Breathing Guide Module
    let breathInterval = null;
    let breathActive = false;
    const breathCircle = document.getElementById('breathCircle');
    const breathBtn = document.getElementById('breathBtn');
    const breathInstruction = document.getElementById('breathInstruction');

    breathBtn.addEventListener('click', () => {
      if (breathActive) {
        clearInterval(breathInterval);
        breathActive = false;
        breathCircle.style.transform = 'scale(1)';
        breathCircle.textContent = 'Tarik Napas';
        breathInstruction.textContent = 'Ikuti ritme lingkaran untuk menurunkan frekuensi otak.';
        breathBtn.textContent = 'Mulai Latihan Napas';
      } else {
        breathActive = true;
        breathBtn.textContent = 'Hentikan Latihan';
        runBreathingCycle();
        breathInterval = setInterval(runBreathingCycle, 19000); // Total siklus 4-7-8 = 19 detik
      }
    });

    function runBreathingCycle() {
      // Phase 1: Tarik Napas (4d)
      breathCircle.style.transition = 'transform 4s ease-in-out';
      breathCircle.style.transform = 'scale(1.5)';
      breathCircle.textContent = 'Tarik Napas';
      breathInstruction.textContent = 'Tarik napas perlahan lewat hidung...';

      // Phase 2: Tahan (7d)
      setTimeout(() => {
        if (!breathActive) return;
        breathCircle.textContent = 'Tahan';
        breathInstruction.textContent = 'Tahan napas kamu...';
      }, 4000);

      // Phase 3: Hembuskan (8d)
      setTimeout(() => {
        if (!breathActive) return;
        breathCircle.style.transition = 'transform 8s ease-in-out';
        breathCircle.style.transform = 'scale(1)';
        breathCircle.textContent = 'Hembuskan';
        breathInstruction.textContent = 'Hembuskan perlahan lewat mulut...';
      }, 11000);
    }

    // Eureka Notes Module (localStorage)
    const noteInput = document.getElementById('noteInput');
    const saveNoteBtn = document.getElementById('saveNoteBtn');
    const noteList = document.getElementById('noteList');

    function loadNotes() {
      try {
        const notes = JSON.parse(localStorage.getItem('gp_notes') || '[]');
        noteList.innerHTML = '';
        notes.forEach((note, index) => {
          const item = document.createElement('div');
          item.className = 'note-item';
          item.innerHTML = `
            <span>${note}</span>
            <button onclick="deleteNote(${index})">&times;</button>
          `;
          noteList.appendChild(item);
        });
      } catch (e) {
        console.error('Load Notes Error:', e);
      }
    }

    saveNoteBtn.addEventListener('click', () => {
      const text = noteInput.value.trim();
      if (!text) return;
      try {
        const notes = JSON.parse(localStorage.getItem('gp_notes') || '[]');
        notes.unshift(text);
        localStorage.setItem('gp_notes', JSON.stringify(notes));
        noteInput.value = '';
        loadNotes();
      } catch (e) {
        console.error('Save Note Error:', e);
      }
    });

    window.deleteNote = function(index) {
      try {
        const notes = JSON.parse(localStorage.getItem('gp_notes') || '[]');
        notes.splice(index, 1);
        localStorage.setItem('gp_notes', JSON.stringify(notes));
        loadNotes();
      } catch (e) {
        console.error('Delete Note Error:', e);
      }
    };

    loadNotes();
  </script>
</body>
</html>
